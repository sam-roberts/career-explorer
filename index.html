<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171a21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Schibsted+Grotesk:wght@500;600;700&display=swap">
<title>Career Explorer (AU)</title>
<style>
  :root {
    color-scheme: dark;
    /* UI: Atkinson Hyperlegible Next (built for legibility; the Atkinson family is also used by Jobs and Skills Australia).
       Display: Schibsted Grotesk for headings, job names and big numbers. */
    --font-ui: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Schibsted Grotesk", "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e8eaf0; --muted: #8b93a7;
    --good: #30a46c; --mid: #ffb224; --bad: #e5484d; --warn-bg: #3a2a00; --warn: #ffcf5c;
  }
  * { box-sizing: border-box; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: rgba(62,99,221,.25); }
  :focus-visible { outline: 2px solid #8fb5ff; outline-offset: 2px; }
  ::selection { background: rgba(62,99,221,.45); color: #fff; }
  ::placeholder { color: var(--muted); opacity: 1; }
  * { scrollbar-color: #343a48 transparent; scrollbar-width: thin; }
  a { text-underline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: absolute; left: 8px; top: -40px; z-index: 50; background: #3e63dd; color: #fff; padding: 6px 10px; border-radius: 6px; }
  .skip:focus { top: 8px; }
  table, .big, .pill, .rng-head b, .ladder { font-variant-numeric: tabular-nums; }
  th button { all: unset; cursor: pointer; } th button:hover { color: var(--text); }
  .rowbtn { all: unset; cursor: pointer; } .rowbtn:hover { text-decoration: underline; }
  .tablewrap { overflow-x: auto; }
  .tablewrap table { table-layout: fixed; min-width: 470px; }
  .tablewrap th:first-child { width: auto; }
  .tablewrap th { width: 66px; } .tablewrap th:first-child { width: auto; }
  .tablewrap td { overflow-wrap: anywhere; }
  td.num { color: var(--text); }
  .of { font-size: 11px; opacity: .8; margin-left: 1px; }
  .sortnote { margin: -2px 0 6px; color: var(--muted); font-size: 12px; }
  .strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; margin: 10px 0 12px; background: #13161d; }
  .strip .stat { padding: 10px 12px; min-width: 0; }
  .strip .stat:nth-child(odd) { border-right: 1px solid var(--line); }
  .strip .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .strip .lab { color: var(--muted); font-size: 12px; }
  .strip .val { font: 700 22px/1.2 var(--font-display); letter-spacing: -.01em; margin: 2px 0; overflow-wrap: anywhere; }
  .strip .ver { font-size: 12px; color: #c4cad8; }
  .unit { font: 400 13px var(--font-ui); color: var(--muted); }
  details.more { margin-top: 8px; }
  details.more summary { cursor: pointer; color: #8fb5ff; font-size: 13px; }
  details.more summary:hover { text-decoration: underline; }
  .showall { width: 100%; margin-top: 8px; }
  #stage:focus-visible { outline-offset: -3px; }
  .node:focus { outline: none; }
  .node:focus-visible rect { stroke: #fff !important; stroke-width: 3; stroke-dasharray: 5 3; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--font-ui); }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font: 700 18px/1.2 var(--font-display); letter-spacing: -.01em; margin: 0 8px 0 0; }
  .ctrl { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  select, input[type=search], button { background: #0f1115; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; }
  button { cursor: pointer; } button:hover { border-color: #4a5263; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .searchbox { position: relative; display: flex; align-items: center; color: var(--muted); }
  .searchbox svg { position: absolute; left: 8px; top: 50%; margin-top: -7px; width: 14px; height: 14px; display: block; pointer-events: none; }
  .searchbox input { padding-left: 27px; padding-right: 30px; width: 200px; }
  .searchbox input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
  .searchbox .clear { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; padding: 0;
    display: grid; place-items: center; border: 0; border-radius: 50%; background: #2a2f3a; color: var(--text); }
  .searchbox .clear:hover { background: #3a4150; }
  .searchbox .clear[hidden] { display: none; }
  .searchbox:focus-within { color: var(--text); }
  .dd { position: relative; }
  .dd > button { display: inline-flex; align-items: center; gap: 4px; }
  .dd > button[aria-expanded="true"] { border-color: #3e63dd; }
  .dd .caret { font-size: 10px; color: var(--muted); }
  .badge { display: inline-block; min-width: 18px; text-align: center; background: #3e63dd; color: #fff; border-radius: 999px; font-size: 11px; padding: 0 4px; margin-left: 2px; line-height: 16px; }
  .badge.off { visibility: hidden; }
  .dd-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 290px; background: var(--panel);
    max-height: calc(100vh - 110px); overflow-y: auto; overscroll-behavior: contain;
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); padding: 6px 0; }
  .dd-sec { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .dd-sec:last-child { border-bottom: 0; }
  .dd-menu.align-right { left: auto; right: 0; }
  .dd-top { position: sticky; top: -6px; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    margin-top: -6px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .dd-title { font: 700 15px var(--font-display); }
  .dd-actions { display: flex; gap: 6px; }
  button.primary { background: #3e63dd; border-color: #3e63dd; color: #fff; } button.primary:hover { background: #3255c8; border-color: #3255c8; }
  .dd-scrim { display: none; }
  .dd-head { display: flex; justify-content: space-between; font: 600 13px/1.3 var(--font-display); margin-bottom: 6px; }
  .linkbtn { all: unset; cursor: pointer; color: #8fb5ff; font: 400 12px var(--font-ui); } .linkbtn:hover { text-decoration: underline; }
  .empty { padding: 14px; border: 1px dashed var(--line); border-radius: 10px; color: var(--text); } .empty p { margin: 0 0 10px; }
  .dd-menu label { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; cursor: pointer; }
  .dd-foot { padding: 8px 12px 4px; text-align: right; }
  .rng { margin: 2px 0 12px; }
  .dd-menu label.switch { align-items: flex-start; gap: 10px; padding: 4px 0 2px; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .knob { flex: none; position: relative; width: 30px; height: 16px; margin-top: 1px; border-radius: 999px; background: #2a2f3a; border: 1px solid var(--line); transition: background .15s; }
  .switch .knob::after { content: ""; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px; border-radius: 50%; background: #8b93a7; transition: transform .15s, background .15s; }
  .switch input:checked + .knob { background: #3e63dd; border-color: #3e63dd; }
  .switch input:checked + .knob::after { transform: translateX(14px); background: #fff; }
  .switch input:focus-visible + .knob { box-shadow: 0 0 0 3px rgba(62,99,221,.5); }
  .switch .sub { display: block; color: var(--muted); font-size: 11px; }
  .rng-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .rng-head b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .dual { position: relative; height: 20px; }
  .dual .track { position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: 2px; background: #2a2f3a; }
  .dual .fill { position: absolute; top: 0; bottom: 0; background: #3e63dd; border-radius: 2px; }
  .dual input[type=range] { position: absolute; left: 0; top: 0; width: 100%; height: 20px; margin: 0; background: none;
    pointer-events: none; -webkit-appearance: none; appearance: none; }
  .dual input[type=range]::-webkit-slider-runnable-track { background: none; height: 20px; }
  .dual input[type=range]::-moz-range-track { background: none; }
  .dual input[type=range]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 14px; height: 14px; margin-top: 3px;
    border-radius: 50%; background: #fff; border: 2px solid #3e63dd; cursor: ew-resize; }
  .dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #3e63dd; cursor: ew-resize; }
  .dual input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(62,99,221,.5); }
  .rng.single .dual input[type=range] { pointer-events: auto; cursor: pointer; }
  .rng .ticks { display: flex; justify-content: space-between; margin-top: 2px; color: var(--muted); font-size: 11px; }
  .rng .ticks span { flex: 1; text-align: center; } .rng .ticks span:first-child { text-align: left; } .rng .ticks span:last-child { text-align: right; }
  .chip { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: 11px;
    color: var(--muted); user-select: none; }
  .chip.on { background: #26324a; border-color: #3e63dd; color: var(--text); }
  main { display: grid; grid-template-columns: 1fr 6px var(--pw, 400px); min-height: 0; }
  .resizer { cursor: col-resize; background: var(--line); position: relative; touch-action: none; outline: none; transition: background .15s; }
  .resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: -5px; right: -5px; } /* wider grab area */
  .resizer:hover, .resizer:focus-visible, .resizer.drag { background: #3e63dd; }
  .resizer .grip { position: absolute; top: 50%; left: 1px; width: 4px; height: 36px; margin-top: -18px; border-radius: 2px;
    border-left: 1px solid #8b93a7; border-right: 1px solid #8b93a7; opacity: .6; pointer-events: none; }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
  aside { border-left: 0 !important; }
  main.collapsed { grid-template-columns: 1fr 0 0; }
  main.collapsed .resizer, main.collapsed aside { display: none; }
  #expandPanel { display: none; position: absolute; right: 0; top: 50%; transform: translateY(-50%); z-index: 5;
    padding: 18px 6px; border-radius: 8px 0 0 8px; border-right: 0; font-size: 16px; line-height: 1; background: var(--panel); }
  #expandPanel:hover { border-color: #3e63dd; color: #fff; }
  main.collapsed #expandPanel { display: block; }
  #stage { position: relative; overflow: hidden; cursor: grab; }
  #svg { touch-action: none; }
  #stage.sky { background: #13254A; }
  #stage.sky #links, #stage.sky #nodes { display: none; }
  #stage:not(.sky) #sky { display: none; }
  #sky .axis { stroke: #3B5384; stroke-width: 1; }
  #sky .grid { stroke: #22396A; stroke-width: 1; stroke-dasharray: 2 6; }
  #sky .axlbl { fill: #9FB3DD; font-size: 13px; }
  #sky .tick { fill: #7F95C4; font-size: 11px; }
  #sky .cline { fill: none; stroke: #A9BEEA; stroke-width: 1.2; opacity: .7; }
  .star { cursor: pointer; transition: transform .45s ease, opacity .2s; }
  .star text { fill: #F4F1FF; font-size: 11px; pointer-events: none; opacity: 0; paint-order: stroke; stroke: #13254A; stroke-width: 3px; }
  .star.lbl text, .star:hover text, .star:focus-visible text { opacity: 1; }
  .star.sel .core { stroke: #fff; stroke-width: 2; }
  .star.dim { opacity: .1; }
  .star.gone { display: none; }
  .star:focus { outline: none; }
  .star:focus-visible .core { stroke: #fff; stroke-width: 2.5; stroke-dasharray: 3 2; }
  #stage.sky .legend { background: rgba(19,37,74,.92); border-color: #2C4478; color: #B9C7E6; }
  #stage.drag { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }
  .link { fill: none; stroke: #343a48; stroke-width: 1.5; }
  #links.fadein { animation: linksIn .55s ease-out; }
  @keyframes linksIn { 0%, 55% { opacity: 0; } 100% { opacity: 1; } }
  .node { cursor: pointer; transition: transform .35s ease, opacity .2s; }
  .node rect { stroke-width: 1.5; }
  .node text { fill: var(--text); font-size: 12px; pointer-events: none; }
  .node .sub { fill: var(--muted); font-size: 10px; }
  .node.sel rect { stroke: #fff !important; stroke-width: 2.5; }
  .node.dim { opacity: .18; }
  .node:hover rect { filter: brightness(1.25); }
  .legend { position: absolute; left: 12px; bottom: 12px; background: rgba(23,26,33,.92); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 11px; color: var(--muted); }
  .grad { width: 160px; height: 8px; border-radius: 4px; margin: 4px 0 2px; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; }
  aside h2 { margin: 0 0 2px; font: 700 21px/1.2 var(--font-display); letter-spacing: -.015em; text-wrap: balance; }
  .crumbs ol { list-style: none; margin: -4px 0 10px; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 0; font-size: 13px; }
  .crumbs li { display: inline-flex; align-items: center; min-width: 0; }
  .crumbs li + li::before { content: "/"; color: var(--muted); margin: 0 6px; }
  .crumbs a { color: #8fb5ff; text-decoration: none; } .crumbs a:hover { text-decoration: underline; }
  .crumbs [aria-current] { color: var(--muted); }
  aside h2:focus { outline: none; }
  .backlink { display: inline-block; margin: -4px 0 10px; font-size: 13px; color: #8fb5ff; text-decoration: none; }
  .backlink:hover { text-decoration: underline; }
  aside .crumb { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font: 600 14px/1.3 var(--font-display); color: var(--text); }
  .big { font: 700 22px/1.2 var(--font-display); letter-spacing: -.01em; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag.au { background: #10301f; color: #6be3a2; }
  .tag.us { background: var(--warn-bg); color: var(--warn); }
  .tag.grp { background: #13284a; color: #8fb5ff; }
  .tag.ato { background: #2b1f40; color: #c9a7ff; }
  .tag.biz { background: #3a2410; color: #ffb27a; }
  .seg { display: inline-flex; gap: 0; }
  .seg button { border-radius: 0; } .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg button.on { background: #26324a; border-color: #3e63dd; color: #fff; }
  .ladder td, .ladder th { cursor: default; vertical-align: top; }
  .tag.est { background: #2a2f3a; color: #b8bfcf; }
  a { color: #8fb5ff; }
  .meter { position: relative; height: 10px; background: #0f1115; border-radius: 5px; border: 1px solid var(--line); margin: 6px 0 4px; }
  .meter .fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 4px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
  th.on { color: var(--text); }
  td { padding: 5px 4px; border-bottom: 1px solid #1f232c; }
  tr.row { cursor: pointer; } tr.row:hover td { background: #1d212a; }
  .pill { display: inline-block; min-width: 30px; text-align: center; padding: 1px 5px; border-radius: 4px; font-weight: 600; font-size: 11px; color: #111; }
  .help { color: var(--muted); font-size: 12px; }
  .disclaimer { color: var(--muted); font-size: 11px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  @media (max-width: 900px) {
    main, main.collapsed { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    main.collapsed aside { display: block; }
    .resizer, #expandPanel, main.collapsed #expandPanel { display: none; }
    aside { border-top: 1px solid var(--line); }
  }
  @media (max-width: 600px) {
    header { padding: 8px 10px; gap: 6px 8px; }
    header h1 { font-size: 15px; width: 100%; }
    header .lbl { display: none; }
    .searchbox { flex: 1 1 100%; } .searchbox input { width: 100%; }
    #colorBy { max-width: 190px; }
    main, main.collapsed { grid-template-rows: 50% 50%; }
    .legend { padding: 6px 8px; } .legend .lg-notes { display: none; } .grad { width: 110px; }
    .dd-menu, .dd-menu.align-right { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 78vh;
      border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom); }
    .dd-top { top: 0; margin-top: 0; padding: 14px 16px; }
    .dd-top button { padding: 8px 14px; font-size: 14px; }
    .dd-scrim { position: fixed; inset: 0; z-index: 19; background: rgba(5,8,15,.55); }
    .dd-scrim.on { display: block; }
  }
</style>
</head>
<body>
<a class="skip" href="#panel">Skip to job list</a>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="app">
  <header>
    <h1>Career Explorer <span style="color:var(--muted);font-weight:400">AU</span></h1>
    <div class="ctrl" role="group" aria-label="Explore data as"><span class="lbl">Explore data as:</span>
      <div class="seg"><button id="vEmp" class="on" aria-pressed="true" title="Working for someone else">Employee</button><button id="vOwn" aria-pressed="false" title="Owning the business">Business owner</button></div>
    </div>
    <label class="searchbox" aria-label="Search jobs">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="search" id="search" class="has-clear" name="q" aria-label="Search jobs" autocomplete="off" spellcheck="false" placeholder="Search jobs…">
      <button type="button" id="searchClear" class="clear" aria-label="Clear search" hidden><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </label>
    <div class="ctrl" role="group" aria-label="View the map as"><span class="lbl">View as:</span>
      <div class="seg"><button id="mNodes" class="on" aria-pressed="true">Nodes</button><button id="mSky" aria-pressed="false">Constellation</button></div>
    </div>
    <label class="ctrl"><span class="lbl">Colour by</span>
      <select id="colorBy" aria-label="Colour the map by">
        <option value="rep">AI replaces the job (estimate)</option>
        <option value="ai">AI can do the tasks (official)</option>
        <option value="salary">Salary (midpoint)</option>
        <option value="sector">Sector</option>
        <optgroup label="Business owner">
          <option value="med">Owner earnings (median)</option>
          <option value="ceiling">Owner earnings (max)</option>
          <option value="margin">Business margin (net)</option>
          <option value="start">How easy to start alone</option>
          <option value="survival">Business survival (4 yrs)</option>
        </optgroup>
      </select>
    </label>
    <div class="dd" id="filtersDd">
      <button id="filtersBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="filtersMenu">Filters<span class="badge off" id="filterCount" aria-hidden="true"></span> <span class="caret">▾</span></button>
      <div class="dd-menu" id="filtersMenu" role="dialog" aria-label="Filters" hidden>
        <div class="dd-top"><span class="dd-title">Filters</span><span class="dd-actions"><button id="filtersReset">Reset</button><button id="filtersDone" class="primary">Done</button></span></div>
        <div class="dd-sec" id="rangeSec"></div>
        <div class="dd-sec">
          <div class="dd-head">Training needed <span><button type="button" class="linkbtn" id="trainAll">All</button> · <button type="button" class="linkbtn" id="trainNone">None</button></span></div>
          <div id="trainChips"></div>
        </div>
        <div class="dd-sec">
          <div class="dd-head">Data</div>
          <label title="Hide jobs with no official Australian pay figure (estimates and US-converted)"><input type="checkbox" id="auOnly"> Verified AU data only</label>
        </div>
        <div class="dd-sec">
          <div class="dd-head">Business owner</div>
          <label title="Only show businesses one person can realistically start (start score 60+)"><input type="checkbox" id="easyOnly"> Easy to start alone</label>
        </div>
      </div>
    </div>
    <button id="expandAll">Expand all</button>
    <button id="collapseAll">Collapse</button>
  </header>
  <main>
    <div id="stage" tabindex="0" role="region" aria-label="Career map. Arrow keys pan, plus and minus zoom, 0 fits the map. Tab moves between nodes.">

// ---------- constellation view ----------
// A sky chart: across = AI risk (or how hard to start, for owners), up = pay (or owner ceiling).
// Star size = number of workers (or businesses), brightness = pay, colour = the "Colour by" choice.
const SKY = { W: 1200, H: 760, L: 90, R: 30, T: 30, B: 70 };
const starEls = new Map();
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; };
const jit = (o, k) => ((hash(o.n + k) % 1000) / 1000 - .5);
function skyAxes(owner) {
  if (owner) return { x: o => o.biz ? 100 - o.biz.start : null, y: o => { const M = bizModel(o); return M ? M.medProfit : null; },
    yMin: 1e4, yMax: 2e6, size: o => o.ind ? o.ind.total : 0, sizeDiv: 30,
    xl: ["Easy to start alone", "Hard to start"], yl: "Owner earnings (median)", ticks: [3e4, 1e5, 3e5, 1e6] };
  return { x: o => o.rep, y: o => sal(o), yMin: 2e4, yMax: 5e5, size: o => o.ato ? o.ato.people : 0, sizeDiv: 45,
    xl: ["Safer from AI", "AI could replace it"], yl: "Pay (median)", ticks: [5e4, 1e5, 2e5, 4e5] };
}
function skyXY(o, A) {
  const xv = A.x(o), yv = A.y(o); if (xv == null) return null;
  const pw = SKY.W - SKY.L - SKY.R, ph = SKY.H - SKY.T - SKY.B;
  const x = SKY.L + (xv / 100) * pw + jit(o, "x") * 14;
  const y = yv == null ? SKY.H - SKY.B + 22 + jit(o, "y") * 10
    : SKY.T + ph * (1 - (Math.log(Math.max(A.yMin, Math.min(A.yMax, yv))) - Math.log(A.yMin)) / (Math.log(A.yMax) - Math.log(A.yMin))) + jit(o, "y") * 8;
  return [x, y];
}
let skyBgFor = null;
function drawSkyBg(A, owner) {
  if (skyBgFor === owner) return; skyBgFor = owner;
  const bg = document.getElementById("skyBg"); bg.innerHTML = "";
  let seed = 20251118; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;   // fixed-seed random, same sky every time
  for (let i = 0; i < 160; i++) {   // faint background stars (decorative)
    const x = rnd() * SKY.W, y = rnd() * SKY.H;
    bg.appendChild(el("circle", { cx: x, cy: y, r: (i % 3) * .4 + .4, fill: "#C9D6F2", opacity: .25 }));
  }
  const pw = SKY.W - SKY.L - SKY.R, ph = SKY.H - SKY.T - SKY.B, ly = v => SKY.T + ph * (1 - (Math.log(v) - Math.log(A.yMin)) / (Math.log(A.yMax) - Math.log(A.yMin)));
  A.ticks.forEach(v => { bg.appendChild(el("line", { class: "grid", x1: SKY.L, x2: SKY.W - SKY.R, y1: ly(v), y2: ly(v) }));
    const t = el("text", { class: "tick", x: SKY.L - 8, y: ly(v) + 4, "text-anchor": "end" }); t.textContent = fmtM(v); bg.appendChild(t); });
  bg.appendChild(el("line", { class: "axis", x1: SKY.L, x2: SKY.W - SKY.R, y1: SKY.H - SKY.B, y2: SKY.H - SKY.B }));
  bg.appendChild(el("line", { class: "axis", x1: SKY.L, x2: SKY.L, y1: SKY.T, y2: SKY.H - SKY.B }));
  const lab = (txt, a) => { const t = el("text", { class: "axlbl", ...a }); t.textContent = txt; bg.appendChild(t); };
  lab("← " + A.xl[0], { x: SKY.L, y: SKY.H - SKY.B + 52 });
  lab(A.xl[1] + " →", { x: SKY.W - SKY.R, y: SKY.H - SKY.B + 52, "text-anchor": "end" });
  lab(A.yl + " ↑", { x: 10, y: SKY.T - 10 });

}
function renderSky() {
  const owner = state.view === "owner", A = skyAxes(owner);
  drawSkyBg(A, owner);
  const layer = document.getElementById("stars");
  const sel = state.sel, group = sel.c ? sel : sel.parent;
  // labels: every star in a small group; only the 12 biggest in a whole category (keeps it readable)
  const members = group && group.depth > 0 ? leaves(group).filter(passes) : [];
  const labelled = new Set(group && group.depth === 1 ? [...members].sort((a, b) => (A.size(b) || 0) - (A.size(a) || 0)).slice(0, 12) : members);
  const inGroup = o => labelled.has(o);
  const pays = ALL.map(A.y).filter(v => v != null), pMax = Math.log(Math.max(...pays)), pMin = Math.log(Math.min(...pays));
  const order = [];
  ALL.forEach(o => {
    const xy = skyXY(o, A);
    let g = starEls.get(o);
    if (!g) {
      g = el("g", { class: "star", tabindex: 0, role: "button" });
      g.appendChild(el("title"));
      g.appendChild(el("circle", { class: "core" }));
      const t = el("text", { x: 0, y: -10, "text-anchor": "middle" }); g.appendChild(t);
      g.addEventListener("click", e => { e.stopPropagation(); onNodeClick(o); });
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); onNodeClick(o); g.focus(); } });
      g.addEventListener("focus", () => ensureVisible(o));
      layer.appendChild(g); starEls.set(o, g);
    }
    if (!xy) { g.classList.add("gone"); return; }
    o.sx = xy[0]; o.sy = xy[1];
    const r = Math.max(2, Math.min(11, 2 + Math.sqrt(A.size(o) || 0) / A.sizeDiv));
    const yv = A.y(o), bright = yv == null ? .45 : .55 + .45 * (Math.log(yv) - pMin) / ((pMax - pMin) || 1);
    const col = leafColor(o);
    g.style.transform = `translate(${xy[0]}px,${xy[1]}px)`;
    const core = g.querySelector("circle");
    core.setAttribute("r", r); core.setAttribute("fill", col); core.setAttribute("fill-opacity", bright.toFixed(2));
    g.querySelector("text").textContent = o.n; g.querySelector("text").setAttribute("y", -r - 5);
    const pass = passes(o);
    g.classList.toggle("gone", !pass && state.hideNoMatch);
    g.classList.toggle("dim", !pass && !state.hideNoMatch);
    g.classList.toggle("sel", o === sel);
    g.classList.toggle("lbl", o === sel || (inGroup(o) && pass));
    const desc = owner ? `start ${o.biz.start}/100, median ${fmtM(A.y(o))}, max ${fmtM(bizModel(o).ceil.profit)}` : `pay ${yv == null ? "no data" : fmtK(yv)}, AI can do ${o.ai}%, AI replaces ${o.rep}%`;
    g.querySelector("title").textContent = `${o.n}: ${desc}`;
    g.setAttribute("aria-label", `${o.n}. ${desc}`);
    if (o === sel) g.setAttribute("aria-current", "true"); else g.removeAttribute("aria-current");

  order.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const kids = [...layer.children];
  if (order.some((x, i) => kids[i] !== x[2])) { const f = document.activeElement; order.forEach(x => layer.appendChild(x[2])); if (f && f.isConnected) f.focus({ preventScroll: true }); }
  // constellation lines: join the stars of the selected group, left to right
  const lines = document.getElementById("skyLines"); lines.innerHTML = "";
  if (group && group.depth > 0) {
    const pts = leaves(group).filter(o => passes(o) && starEls.has(o) && !starEls.get(o).classList.contains("gone") && o.sx != null)
      .sort((a, b) => a.sx - b.sx).map(o => `${o.sx.toFixed(1)},${o.sy.toFixed(1)}`);
    if (pts.length > 1) lines.appendChild(el("polyline", { class: "cline", points: pts.join(" ") }));
  }
}

// ---------- pan / zoom ----------
const svg = document.getElementById("svg"), vp = document.getElementById("vp"), stage = document.getElementById("stage");
let view = { x: 40, y: 40, k: 1 };
let goodView = { x: 40, y: 40, k: 1 };
const applyView = () => {
  if (![view.x, view.y, view.k].every(Number.isFinite) || view.k <= 0) view = { ...goodView };   // never apply a broken position
  goodView = { ...view };
  vp.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
};
function zoomAt(f, cx, cy) {
  const k = Math.max(.3, Math.min(2.5, view.k * f)); f = k / view.k;
  view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.k = k; applyView();
}
svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
// pointer pan (mouse, pen, one finger) and two-finger pinch zoom
let drag = null, pinch = null;
const pts = new Map();
const pinchInfo = () => { const [a, b] = [...pts.values()], r = svg.getBoundingClientRect();
  return { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2 - r.left, cy: (a.y + b.y) / 2 - r.top }; };
svg.addEventListener("pointerdown", e => {
  if (e.target.closest(".node, .star")) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { drag = { x: e.clientX - view.x, y: e.clientY - view.y }; stage.classList.add("drag"); }
  else if (pts.size === 2) { drag = null; pinch = pinchInfo(); }
});
window.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) { const p = pinchInfo(); zoomAt(p.d / pinch.d, p.cx, p.cy); pinch = p; }
  else if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; applyView(); }
});
const endPtr = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { drag = null; stage.classList.remove("drag"); } };
window.addEventListener("pointerup", endPtr); window.addEventListener("pointercancel", endPtr);
// keyboard: arrows pan, +/- zoom, 0 fits
stage.addEventListener("keydown", e => {
  if (e.target.closest("button")) return;
  const r = svg.getBoundingClientRect(), step = 60;
  const moves = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
  if (moves[e.key]) { view.x += moves[e.key][0]; view.y += moves[e.key][1]; applyView(); e.preventDefault(); }
  else if (e.key === "+" || e.key === "=") { zoomAt(1.2, r.width / 2, r.height / 2); e.preventDefault(); }
  else if (e.key === "-" || e.key === "_") { zoomAt(1 / 1.2, r.width / 2, r.height / 2); e.preventDefault(); }
  else if (e.key === "0") { fit(); e.preventDefault(); }
});
// keep a keyboard-focused node on screen
function ensureVisible(n) {
  const r = svg.getBoundingClientRect();
  if (state.mapMode === "sky") { const x = view.x + n.sx * view.k, y = view.y + n.sy * view.k;
    if (x < 20 || y < 20 || x > r.width - 20 || y > r.height - 20) centerOn(n); return; }
  const x = view.x + n.x * view.k, y = view.y + n.y * view.k;
  if (x < 0 || y < 0 || x + NODE_W[n.depth] * view.k > r.width || y + NODE_H * view.k > r.height) centerOn(n);
}
function fit() {
  if (state.mapMode === "sky") { const r = svg.getBoundingClientRect();
    const k = Math.max(r.width < 600 ? .45 : .2, Math.min(1.4, (r.width - 20) / SKY.W, (r.height - 20) / SKY.H));
    view = { k, x: (r.width - SKY.W * k) / 2, y: (r.height - SKY.H * k) / 2 }; applyView(); return; }
  const vis = layout(), r = svg.getBoundingClientRect();
  const maxX = Math.max(...vis.map(n => n.x + NODE_W[n.depth])), minY = Math.min(...vis.map(n => n.y)), maxY = Math.max(...vis.map(n => n.y + NODE_H));
  // small screens: keep text readable instead of shrinking the whole tree to fit
  const kMin = r.width < 600 ? 0.6 : 0;
  const k = Math.max(kMin, Math.min(1.4, (r.width - 60) / maxX, (r.height - 60) / (maxY - minY)));
  const y = (maxY - minY) * k > r.height - 40 ? 20 - minY * k : (r.height - (maxY + minY) * k) / 2;
  view = { k, x: r.width < 600 ? 12 : 30, y }; applyView();
}
// zoom to a job and its neighbours (or a group and its children), not the whole tree
function focusOn(n) {
  if (state.mapMode === "sky") return centerOn(n);
  const group = n.c ? n : n.parent;
  const set = [group, ...(group.open && group.c ? group.c : [])].filter(x => x.x != null);
  if (!set.length) return centerOn(n);
  const r = svg.getBoundingClientRect();
  const x0 = Math.min(...set.map(x => x.x)), x1 = Math.max(...set.map(x => x.x + NODE_W[x.depth]));
  const y0 = Math.min(...set.map(x => x.y)), y1 = Math.max(...set.map(x => x.y + NODE_H));
  const k = Math.max(.55, Math.min(1.1, (r.width - 60) / (x1 - x0), (r.height - 60) / (y1 - y0)));
  view = { k, x: r.width / 2 - (x0 + x1) / 2 * k, y: r.height / 2 - (y0 + y1) / 2 * k };
  if ((y1 - y0) * k > r.height - 40) {   // tall group: keep the selected job in view
    const ty = n.c ? y0 : n.y; view.y = Math.min(20 - y0 * k, r.height / 2 - ty * k);
  }
  applyView();
}
function centerOn(n) {
  const r = svg.getBoundingClientRect();
  if (state.mapMode === "sky") { if (n.sx == null) return; view.x = r.width / 2 - n.sx * view.k; view.y = r.height / 2 - n.sy * view.k; applyView(); return; }
  if (n.x == null || n.y == null) return;
  view.x = r.width / 2 - (n.x + 100) * view.k; view.y = r.height / 2 - n.y * view.k; applyView();
}
document.getElementById("zin").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); };
document.getElementById("zout").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); };

})();

const chips = document.getElementById("trainChips");
TRAINING.forEach(t => {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked data-train="${t.id}"> ${t.label}`;
  l.querySelector("input").onchange = e => { e.target.checked ? state.train.add(t.id) : state.train.delete(t.id); filtersChanged(); };
  chips.appendChild(l);
});
const setBadge = n => { const b = document.getElementById("filterCount"); b.classList.toggle("off", !n); b.textContent = n || "0";
  b.setAttribute("aria-hidden", !n); document.getElementById("filtersBtn").setAttribute("aria-label", n ? `Filters, ${n} on` : "Filters"); };
function filtersChanged() {
  const narrowed = k => state[k][0] !== RANGES[k].full[0] || state[k][1] !== RANGES[k].full[1];
  const n = (state.train.size < TRAINING.length ? 1 : 0) + (state.auOnly ? 1 : 0) + (state.easyOnly ? 1 : 0)
    + ["inc", "aiR", "repR", "physR", "skillR"].filter(narrowed).length;
  setBadge(n);
  render(); renderPanel();
}
function setTrain(all) {
  state.train = new Set(all ? TRAINING.map(t => t.id) : []);
  chips.querySelectorAll("input").forEach(i => i.checked = all); filtersChanged();
}
document.getElementById("trainAll").onclick = e => { e.preventDefault(); setTrain(true); };
document.getElementById("trainNone").onclick = e => { e.preventDefault(); setTrain(false); };
document.getElementById("filtersReset").onclick = () => {
  state.auOnly = state.easyOnly = false;
  Object.values(RANGES).forEach(r => r.reset());
  document.getElementById("auOnly").checked = document.getElementById("easyOnly").checked = false;
  setTrain(true);
};
(function () {
  const btn = document.getElementById("filtersBtn"), menu = document.getElementById("filtersMenu");
  const scrim = document.createElement("div"); scrim.className = "dd-scrim"; document.body.appendChild(scrim);
  const set = open => {
    if (open) {   // open toward whichever side has room, so the menu never leaves the screen
      menu.classList.remove("align-right"); menu.hidden = false;
      const b = btn.getBoundingClientRect(), w = menu.offsetWidth;
      if (b.left + w > window.innerWidth - 8) menu.classList.add("align-right");
    } else menu.hidden = true;
    scrim.classList.toggle("on", open); btn.setAttribute("aria-expanded", open);
    if (open) (menu.querySelector("input") || menu).focus({ preventScroll: true });
  };
  document.getElementById("filtersDone").onclick = () => { set(false); btn.focus(); };
  scrim.onclick = () => set(false);
  btn.onclick = e => { e.stopPropagation(); set(menu.hidden); };
  document.addEventListener("click", e => { if (!menu.hidden && !document.getElementById("filtersDd").contains(e.target)) set(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { set(false); btn.focus(); } });
})();
document.getElementById("colorBy").onchange = e => { state.colorBy = e.target.value; render(); };
document.getElementById("easyOnly").onchange = e => { state.easyOnly = e.target.checked; filtersChanged(); };
function setView(v) {
  state.view = v;
  document.getElementById("vEmp").classList.toggle("on", v === "employee");
  document.getElementById("vOwn").classList.toggle("on", v === "owner");
  document.getElementById("vEmp").setAttribute("aria-pressed", v === "employee");
  document.getElementById("vOwn").setAttribute("aria-pressed", v === "owner");
  state.colorBy = v === "owner" ? "med" : "rep";
  document.getElementById("colorBy").value = state.colorBy;
  state.sort = v === "owner" ? { key: "med", dir: -1 } : { key: "rep", dir: 1 };
  render(); renderPanel();
}
function setMapMode(m) {
  state.mapMode = m;
  for (let p = state.sel.parent; p; p = p.parent) p.open = true;   // show the selected job's branch on the node map
  [["mNodes", "nodes"], ["mSky", "sky"]].forEach(([id, v]) => { const b = document.getElementById(id); b.classList.toggle("on", m === v); b.setAttribute("aria-pressed", m === v); });
  render(); fit();
  if (state.sel !== DATA) focusOn(state.sel);
}
document.getElementById("mNodes").onclick = () => setMapMode("nodes");
document.getElementById("mSky").onclick = () => setMapMode("sky");
document.getElementById("vEmp").onclick = () => setView("employee");
document.getElementById("vOwn").onclick = () => setView("owner");
document.getElementById("auOnly").onchange = e => { state.auOnly = e.target.checked; filtersChanged(); };
const searchEl = document.getElementById("search"), clearEl = document.getElementById("searchClear");
const syncClear = () => { clearEl.hidden = !searchEl.value; };
clearEl.onclick = () => { searchEl.value = ""; searchEl.dispatchEvent(new Event("input")); searchEl.focus(); };
searchEl.addEventListener("keydown", e => { if (e.key === "Escape" && searchEl.value) { e.stopPropagation(); clearEl.click(); } });
document.getElementById("search").oninput = e => {
  syncClear();
  state.search = e.target.value.trim().toLowerCase();
  if (state.search) (function open(n) { if (n.c) { n.open = leaves(n).some(passes); n.c.forEach(open); } })(DATA);
  render(); renderPanel();
};
const setAll = v => (function f(n) { if (n.c) { if (n.depth) n.open = v; n.c.forEach(f); } })(DATA);
document.getElementById("expandAll").onclick = () => { setAll(true); render(); fit(); };
document.getElementById("collapseAll").onclick = () => { setAll(false); state.sel = DATA; render(); renderPanel(); fit(); };

document.querySelector(".skip").addEventListener("click", e => { e.preventDefault(); panel.focus(); });

// ---------- resizable / collapsible side panel ----------
(function () {
  const mainEl = document.querySelector("main"), rz = document.getElementById("resizer");
  const MIN_W = 280, COLLAPSE_W = 200, MIN_GRAPH = 320;
  let width = +localStorage.getItem("panelW") || 400;
  let collapsed = localStorage.getItem("panelCollapsed") === "1";
  const maxW = () => Math.max(MIN_W, mainEl.clientWidth - MIN_GRAPH);
  function apply(save = true) {
    width = Math.min(Math.max(width, MIN_W), maxW());
    mainEl.style.setProperty("--pw", width + "px");
    mainEl.classList.toggle("collapsed", collapsed);
    rz.setAttribute("aria-valuenow", width);
    if (save) { localStorage.setItem("panelW", width); localStorage.setItem("panelCollapsed", collapsed ? "1" : "0"); }
  }
  let dragging = false, startW = width;
  rz.addEventListener("pointerdown", e => {
    dragging = true; startW = width; rz.setPointerCapture(e.pointerId); rz.classList.add("drag"); document.body.classList.add("resizing"); e.preventDefault();
  });
  rz.addEventListener("pointermove", e => {
    if (!dragging) return;
    const w = mainEl.getBoundingClientRect().right - e.clientX - 3;
    if (w < COLLAPSE_W) { collapsed = true; apply(false); return; }   // too small: collapse
    collapsed = false; width = w; apply(false);
  });
  const end = () => { if (!dragging) return; dragging = false; if (collapsed) width = startW; rz.classList.remove("drag"); document.body.classList.remove("resizing"); apply(); };
  rz.addEventListener("pointerup", end); rz.addEventListener("pointercancel", end);
  rz.addEventListener("dblclick", () => { width = 400; apply(); });
  rz.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { width += 20; apply(); e.preventDefault(); }
    else if (e.key === "ArrowRight") { if (width - 20 < MIN_W) collapsed = true; else width -= 20; apply(); e.preventDefault(); }
    else if (e.key === "Enter") { collapsed = true; apply(); document.getElementById("expandPanel").focus(); }
  });
  document.getElementById("expandPanel").onclick = () => { collapsed = false; apply(); rz.focus(); };
  window.addEventListener("resize", () => apply(false));
  apply(false);
})();

document.getElementById("search").placeholder = `Search ${ALL.length} jobs…`;

// ---------- URL state: shareable links + browser back/forward ----------
let restoring = false, lastSelKey = null;
const selKey = n => !n || n.depth === 0 ? "" : n.c ? (n.depth === 1 ? "g:" + n.n : "g:" + n.parent.n + "|" + n.n) : "j:" + n.n;
function syncURL() {
  if (restoring || typeof RANGES === "undefined" || !RANGES.inc) return;
  const q = new URLSearchParams();
  if (state.view === "owner") q.set("view", "owner");
  if (state.colorBy !== (state.view === "owner" ? "med" : "rep")) q.set("colour", state.colorBy);
  if (state.search) q.set("q", state.search);
  if (state.train.size < TRAINING.length) q.set("train", [...state.train].sort().join("."));
  if (state.auOnly) q.set("verified", "1");
  if (state.easyOnly) q.set("easy", "1");
  ["inc", "aiR", "repR", "physR", "skillR"].forEach(k => { const r = state[k], f = RANGES[k].full; if (r[0] !== f[0] || r[1] !== f[1]) q.set({ inc: "income", aiR: "tasks", repR: "replace", physR: "physical", skillR: "skill" }[k], r.join("-")); });
  if (state.hideNoMatch) q.set("hide", "1");
  if (state.mapMode === "sky") q.set("map", "sky");
  const def = state.view === "owner" ? "med.-1" : "rep.1";
  if (state.sort.key + "." + state.sort.dir !== def) q.set("sort", state.sort.key + "." + state.sort.dir);
  const k = selKey(state.sel); if (k) q.set(k[0] === "j" ? "job" : "group", k.slice(2));
  const url = location.pathname + (q.toString() ? "?" + q : "");
  if (url === location.pathname + location.search) { lastSelKey = k; return; }
  if (lastSelKey !== null && k !== lastSelKey) history.pushState(null, "", url); else history.replaceState(null, "", url);
  lastSelKey = k;
}
function findSel(q) {
  const job = q.get("job"), grp = q.get("group");
  if (job) return ALL.find(o => o.n === job);
  if (grp) { const [a, b] = grp.split("|"); const c = DATA.c.find(x => x.n === a); return c && (b ? c.c.find(x => x.n === b) : c); }
  return DATA;
}
function readURL() {
  restoring = true;
  const q = new URLSearchParams(location.search);
  const v = q.get("view") === "owner" ? "owner" : "employee";
  state.view = v;
  document.getElementById("vEmp").classList.toggle("on", v === "employee");
  document.getElementById("vOwn").classList.toggle("on", v === "owner");
  document.getElementById("vEmp").setAttribute("aria-pressed", v === "employee");
  document.getElementById("vOwn").setAttribute("aria-pressed", v === "owner");
  state.colorBy = q.get("colour") && METRIC[q.get("colour")] || q.get("colour") === "sector" ? q.get("colour") : (v === "owner" ? "med" : "rep");
  document.getElementById("colorBy").value = state.colorBy;
  const [sk, sd] = (q.get("sort") || (v === "owner" ? "med.-1" : "rep.1")).split(".");
  state.sort = { key: sk, dir: +sd || 1 };
  state.search = (q.get("q") || "").toLowerCase(); document.getElementById("search").value = q.get("q") || ""; document.getElementById("searchClear").hidden = !q.get("q");
  const tr = q.get("train"); state.train = new Set(tr != null ? tr.split(".").filter(x => x !== "").map(Number) : TRAINING.map(t => t.id));
  chips.querySelectorAll("input").forEach(i => i.checked = state.train.has(+i.dataset.train));
  state.auOnly = q.get("verified") === "1"; document.getElementById("auOnly").checked = state.auOnly;
  state.easyOnly = q.get("easy") === "1"; document.getElementById("easyOnly").checked = state.easyOnly;
  [["inc", "income"], ["aiR", "tasks"], ["repR", "replace"], ["physR", "physical"], ["skillR", "skill"]].forEach(([k, name]) => {
    const r = q.get(name); if (r) RANGES[k].set(r.split("-").map(Number)); else RANGES[k].reset(); });
  state.hideNoMatch = q.get("hide") === "1";
  state.mapMode = q.get("map") === "sky" ? "sky" : "nodes";
  [["mNodes", "nodes"], ["mSky", "sky"]].forEach(([id, m]) => { const b = document.getElementById(id); b.classList.toggle("on", state.mapMode === m); b.setAttribute("aria-pressed", state.mapMode === m); });
  const hb = document.getElementById("hideNoMatch"); hb.checked = state.hideNoMatch;
  document.getElementById("hideNoMatchSub").textContent = hb.checked ? "On: non-matches disappear" : "Off: non-matches are faded";
  if (state.search) (function open(n) { if (n.c) { n.open = leaves(n).some(passes); n.c.forEach(open); } })(DATA);
  const sel = findSel(q) || DATA;
  for (let p = sel.parent; p; p = p.parent) p.open = true;
  if (sel.c && sel.depth > 0) sel.open = true;
  state.sel = sel;
  const nb = document.getElementById("filterCount");
  const narrowed = k => state[k][0] !== RANGES[k].full[0] || state[k][1] !== RANGES[k].full[1];
  const cnt = (state.train.size < TRAINING.length ? 1 : 0) + (state.auOnly ? 1 : 0) + (state.easyOnly ? 1 : 0) + ["inc", "aiR", "repR", "physR", "skillR"].filter(narrowed).length;
  setBadge(cnt);
  restoring = false;
  lastSelKey = selKey(sel);
  return sel;
}
window.addEventListener("popstate", () => { const sel = readURL(); render(); renderPanel(); fit(); if (sel !== DATA) focusOn(sel); });

const startSel = readURL();
render(); renderPanel(); fit();
if (startSel !== DATA) focusOn(startSel);
window.addEventListener("resize", () => state.sel !== DATA ? focusOn(state.sel) : fit());
</script>
